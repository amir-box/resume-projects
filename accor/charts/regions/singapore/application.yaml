apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: myapp-us-east-1
  namespace: argocd
spec:
  project: default

  source:
    repoURL: https://github.com/your-org/platform-gitops
    targetRevision: main
    path: charts/myapp

    helm:
      valueFiles:
        - ../../environments/us-east-1/values.yaml

  destination:
    server: https://kubernetes.default.svc
    namespace: myapp

  syncPolicy:
    automated:
      prune: true
      selfHeal: true