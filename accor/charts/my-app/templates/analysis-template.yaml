apiVersion: argoproj.io/v1alpha1
kind: AnalysisTemplate

metadata:
  name: success-rate

spec:
  metrics:
    - name: success-rate

      interval: 1m

      successCondition: result[0] >= 0.95

      provider:
        prometheus:

          address: https://aps-workspaces.us-east-1.amazonaws.com/workspaces/ws-12345678-abcd-efgh

          query: |
            sum(rate(http_requests_total{status!~"5.."}[2m]))
            /
            sum(rate(http_requests_total[2m]))